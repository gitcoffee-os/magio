services:
  magio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magio
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/magio:/home/magio/.config/magio
      - ./data/opencode/share:/home/magio/.local/share/opencode
      - ./data/opencode/state:/home/magio/.local/state/opencode
      - ./data/opencode/config:/home/magio/.config/opencode
      - ./data/ssh:/home/magio/.ssh
      - ./workspaces:/home/magio/workspaces
    environment:
      # Docker binds Magio to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   MAGIO_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      MAGIO_UI_PASSWORD: ${MAGIO_UI_PASSWORD:?Set MAGIO_UI_PASSWORD before exposing Magio through Docker}
    # MAGIO_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # MAGIO_TUNNEL_PROVIDER: cloudflare
    # MAGIO_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # MAGIO_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # MAGIO_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # MAGIO_TUNNEL_CONFIG: /home/magio/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # MAGIO_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
